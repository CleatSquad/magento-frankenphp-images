---
name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: mohelmrabet/magento-frankenphp

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build, Test and Push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: ['8.2', '8.3', '8.4', '8.5']
        target: ['base', 'dev']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Dockerfile ARG is the single source of truth, so a Renovate bump
      # of the Dockerfile is enough to publish the new tags.
      - name: Read FrankenPHP version from Dockerfile
        id: fp
        run: |
          version="$(sed -n 's/^ARG FRANKENPHP_VERSION=//p' Dockerfile)"
          test -n "$version" || { echo "ARG FRANKENPHP_VERSION not found in Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=php${{ matrix.php_version }}-fp${{ steps.fp.outputs.version }}-${{ matrix.target }}
            type=raw,value=${{ matrix.target }},enable=${{ matrix.php_version == '8.4' }}
            type=raw,value=latest,enable=${{ matrix.php_version == '8.4' && matrix.target == 'base' }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            FRANKENPHP_VERSION=${{ steps.fp.outputs.version }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:php${{ matrix.php_version }}"
          IMAGE_TAG="${IMAGE_TAG}-fp${{ steps.fp.outputs.version }}-${{ matrix.target }}"

          echo "🔍 Testing PHP version..."
          docker run --rm ${IMAGE_TAG} php -v | grep -q "PHP ${{ matrix.php_version }}"

          echo "🔍 Testing PHP extensions..."
          docker run --rm ${IMAGE_TAG} php -m | grep -q "bcmath"
          docker run --rm ${IMAGE_TAG} php -m | grep -q "gd"
          docker run --rm ${IMAGE_TAG} php -m | grep -q "intl"
          docker run --rm ${IMAGE_TAG} php -m | grep -q "pdo_mysql"
          docker run --rm ${IMAGE_TAG} php -m | grep -q "redis"

          echo "🔍 Testing Composer..."
          docker run --rm ${IMAGE_TAG} composer --version

          echo "🔍 Testing FrankenPHP..."
          docker run --rm ${IMAGE_TAG} frankenphp version

          echo "✅ All tests passed!"

      # Runs only on main, after the tests above: a broken image is never published.
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            FRANKENPHP_VERSION=${{ steps.fp.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
